buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.10"

        // AndroidX versions
        androidXCore = "1.10.1"
        androidXAnnotation = "1.7.1"
        androidXAppCompat = "1.6.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.2") // latest stable
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

subprojects {
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:${androidXCore}"
            force "androidx.annotation:annotation:${androidXAnnotation}"
            force "androidx.appcompat:appcompat:${androidXAppCompat}"
            exclude group: 'com.android.support'
            exclude module: 'support-v4'
            exclude module: 'support-annotations'
            exclude module: 'support-compat'
        }
    }
}
